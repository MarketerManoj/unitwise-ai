  <!-- ========================================================================
       DETERMINISTIC FINANCIAL CALCULATION ENGINE (Exact Tested Module)
       ======================================================================== -->
  <script>
  const UnitWiseEngine = (function () {
    'use strict';

    function safeNum(val, fallback) {
      var n = Number(val);
      return Number.isFinite(n) ? n : (fallback !== undefined ? fallback : 0);
    }

    function clamp(val, min, max) {
      var n = safeNum(val, min);
      return Math.min(Math.max(n, min), max);
    }

    function safeDiv(numerator, denominator) {
      var num = safeNum(numerator, NaN);
      var den = safeNum(denominator, NaN);
      if (!Number.isFinite(num) || !Number.isFinite(den) || den === 0) return null;
      return num / den;
    }

    function formatINR(value, decimals) {
      if (value === null || value === undefined || !Number.isFinite(Number(value))) return 'N/A';
      var n = Number(value);
      var dec = decimals !== undefined ? decimals : 0;
      var sign = n < 0 ? '-' : '';
      var abs = Math.abs(n);
      var formatted = new Intl.NumberFormat('en-IN', {
        minimumFractionDigits: dec,
        maximumFractionDigits: dec
      }).format(abs);
      return sign + '₹' + formatted;
    }

    function formatPct(value, decimals) {
      if (value === null || value === undefined || !Number.isFinite(Number(value))) return 'N/A';
      var dec = decimals !== undefined ? decimals : 1;
      return Number(value).toFixed(dec) + '%';
    }

    function formatCount(value, decimals) {
      if (value === null || value === undefined || !Number.isFinite(Number(value))) return 'N/A';
      var dec = decimals !== undefined ? decimals : 0;
      return new Intl.NumberFormat('en-IN', {
        minimumFractionDigits: dec,
        maximumFractionDigits: dec
      }).format(Number(value));
    }

    function computeOutputTax(baseAmount, gstRatePct, priceMode) {
      var base = Math.max(0, safeNum(baseAmount, 0));
      var rate = clamp(gstRatePct, 0, 100) / 100;
      if (priceMode === 'GST_INCLUSIVE') {
        var netRevenue = rate > 0 ? base / (1 + rate) : base;
        var gstCollected = base - netRevenue;
        return { netRevenue: netRevenue, gstCollected: gstCollected, grossCollections: base };
      }
      var gst = base * rate;
      return { netRevenue: base, gstCollected: gst, grossCollections: base + gst };
    }

    function applyExpenseTax(baseExpense, gstRatePct, isEligible, gstCreditTreatment) {
      var base = Math.max(0, safeNum(baseExpense, 0));
      var rate = clamp(gstRatePct, 0, 100) / 100;
      if (!isEligible || rate <= 0) {
        return { effectiveExpense: base, recoverableItc: 0, nonRecoverableGst: 0 };
      }
      var taxAmount = base * rate;
      if (gstCreditTreatment === 'NON_RECOVERABLE') {
        return { effectiveExpense: base + taxAmount, recoverableItc: 0, nonRecoverableGst: taxAmount };
      }
      return { effectiveExpense: base, recoverableItc: taxAmount, nonRecoverableGst: 0 };
    }

    function computeBreakEven(totalFixedExpenses, contributionPerUnit) {
      var fixed = Math.max(0, safeNum(totalFixedExpenses, 0));
      if (contributionPerUnit === null || !Number.isFinite(contributionPerUnit) || contributionPerUnit <= 0) {
        return {
          achievable: false,
          units: null,
          message: 'Break-even not achievable under current assumptions.'
        };
      }
      if (fixed === 0) {
        return { achievable: true, units: 0, message: 'No fixed overhead — profitable from the first unit.' };
      }
      return { achievable: true, units: Math.ceil(fixed / contributionPerUnit), message: null };
    }

    function computeOptionalIncomeTax(operatingProfit, includeIncomeTax, incomeTaxRatePct) {
      var rate = clamp(incomeTaxRatePct, 0, 100) / 100;
      if (!includeIncomeTax || rate <= 0) {
        return { enabled: !!includeIncomeTax, ratePct: clamp(incomeTaxRatePct, 0, 100), estimatedIncomeTax: 0, postTaxProfit: operatingProfit };
      }
      var tax = operatingProfit > 0 ? operatingProfit * rate : 0;
      return { enabled: true, ratePct: clamp(incomeTaxRatePct, 0, 100), estimatedIncomeTax: tax, postTaxProfit: operatingProfit - tax };
    }

    var DEFAULT_EDUCATION_INPUTS = {
      courseFee: 25000, enrolledStudents: 30, discountPct: 0, refundPct: 0, priceMode: 'GST_EXCLUSIVE',
      gstRatePct: 18, gstCreditTreatment: 'RECOVERABLE',
      expenseGstEligible: { lms: true, gateway: true, trainer: false, sales: false, marketing: true, otherVariable: false, fixed: false },
      lmsCost: 2500, lmsBasis: 'PER_STUDENT',
      gatewayFee: 750, gatewayBasis: 'FIXED_PER_STUDENT',
      trainerCost: 5000, trainerBasis: 'PER_STUDENT',
      salesCommission: 2500, salesBasis: 'FIXED_PER_STUDENT',
      otherVariablePerStudent: 0,
      totalAdSpend: 150000, totalLeads: 300, attributedStudents: 30, additionalMarketingPerStudent: 0,
      batchOverhead: 30000, otherFixedExpenses: 0,
      includeIncomeTax: false, incomeTaxRatePct: 25, targetMarginPct: 15
    };

    var DEFAULT_REAL_ESTATE_INPUTS = {
      avgPropertyValue: 6000000, brokerageRatePct: 2, fixedRevenuePerDeal: 120000, revenueMethod: 'PROPERTY_X_BROKERAGE',
      gstRatePct: 18, priceMode: 'GST_EXCLUSIVE', gstCreditTreatment: 'RECOVERABLE',
      expenseGstEligible: { marketing: true, sales: false, otherVariable: false, fixed: false },
      totalLeads: 300, qualifiedLeads: 90, siteVisits: 15, bookings: 5, grossClosedDeals: 3, cancellationRatePct: 0,
      totalAdSpend: 60000, additionalMarketingCosts: 0,
      salesCostPerNetDeal: 20000, otherVariableCostPerNetDeal: 5000, monthlyFixedOverhead: 45000, otherFixedExpenses: 0,
      includeIncomeTax: false, incomeTaxRatePct: 25, targetMarginPct: 15
    };

    var DEFAULT_TRAVEL_INPUTS = {
      sellingPricePerTraveler: 35000, travelers: 20, bookings: 10, revenueModel: 'GROSS_PACKAGE',
      partnerCommissionRatePct: 15, cancellationRatePct: 0,
      gstRatePct: 5, priceMode: 'GST_EXCLUSIVE', gstCreditTreatment: 'RECOVERABLE',
      expenseGstEligible: { supplier: false, gateway: true, marketing: true, otherVariable: false, fixed: false },
      hotelSupplierCostPerTraveler: 18000, transportCostPerTraveler: 5000, mealCostPerTraveler: 2000,
      otherSupplierExpenses: 0, otherVariableCostPerTraveler: 2000,
      gatewayFee: 0, gatewayBasis: 'PCT_OF_COLLECTION',
      totalAdSpend: 60000, totalEnquiries: 200, attributedBookings: 10,
      fixedTripOverhead: 20000, monthlyOperationalOverhead: 15000, otherFixedExpenses: 0,
      includeIncomeTax: false, incomeTaxRatePct: 25, targetMarginPct: 10
    };

    function calculateEducation(rawInputs) {
      var inp = Object.assign({}, DEFAULT_EDUCATION_INPUTS, rawInputs || {});
      var elig = Object.assign({}, DEFAULT_EDUCATION_INPUTS.expenseGstEligible, inp.expenseGstEligible || {});

      var courseFee = Math.max(0, safeNum(inp.courseFee, 0));
      var enrolledStudents = Math.max(0, safeNum(inp.enrolledStudents, 0));
      var discountPct = clamp(inp.discountPct, 0, 100);
      var refundPct = clamp(inp.refundPct, 0, 100);
      var gstRatePct = clamp(inp.gstRatePct, 0, 100);
      var totalAdSpend = Math.max(0, safeNum(inp.totalAdSpend, 0));
      var totalLeads = Math.max(0, safeNum(inp.totalLeads, 0));
      var attributedStudents = Math.max(0, safeNum(inp.attributedStudents, 0));

      var grossBeforeAdjustments = courseFee * enrolledStudents;
      var discountAmount = grossBeforeAdjustments * (discountPct / 100);
      var afterDiscount = grossBeforeAdjustments - discountAmount;
      var refundAmount = afterDiscount * (refundPct / 100);
      var refundedStudents = enrolledStudents * (refundPct / 100);
      var netStudents = Math.max(0, enrolledStudents - refundedStudents);
      var collectionsBase = afterDiscount - refundAmount;

      var taxRes = computeOutputTax(collectionsBase, gstRatePct, inp.priceMode);
      var netRevenue = taxRes.netRevenue;
      var gstCollected = taxRes.gstCollected;
      var grossCustomerCollections = taxRes.grossCollections;
      var netRevenuePerStudent = safeDiv(netRevenue, netStudents);

      var waterfallGrossCollections = inp.priceMode === 'GST_INCLUSIVE'
        ? grossBeforeAdjustments : grossBeforeAdjustments * (1 + gstRatePct / 100);
      var waterfallDiscountsAndRefunds = inp.priceMode === 'GST_INCLUSIVE'
        ? (discountAmount + refundAmount) : (discountAmount + refundAmount) * (1 + gstRatePct / 100);

      var lmsBase = inp.lmsBasis === 'PER_BATCH' ? Math.max(0, safeNum(inp.lmsCost, 0)) : Math.max(0, safeNum(inp.lmsCost, 0)) * netStudents;
      var trainerBase = inp.trainerBasis === 'PER_BATCH' ? Math.max(0, safeNum(inp.trainerCost, 0)) : Math.max(0, safeNum(inp.trainerCost, 0)) * netStudents;
      var gatewayBase = inp.gatewayBasis === 'PCT_OF_COLLECTION'
        ? grossCustomerCollections * (clamp(inp.gatewayFee, 0, 100) / 100)
        : Math.max(0, safeNum(inp.gatewayFee, 0)) * netStudents;

      var lmsTax = applyExpenseTax(lmsBase, gstRatePct, elig.lms, inp.gstCreditTreatment);
      var trainerTax = applyExpenseTax(trainerBase, gstRatePct, elig.trainer, inp.gstCreditTreatment);
      var gatewayTax = applyExpenseTax(gatewayBase, gstRatePct, elig.gateway, inp.gstCreditTreatment);

      var lmsExpenses = lmsTax.effectiveExpense;
      var trainerExpenses = trainerTax.effectiveExpense;
      var gatewayExpenses = gatewayTax.effectiveExpense;
      var directDeliveryCosts = lmsExpenses + trainerExpenses + gatewayExpenses;
      var grossProfit = netRevenue - directDeliveryCosts;

      var salesBase = inp.salesBasis === 'PCT_OF_REVENUE'
        ? netRevenue * (clamp(inp.salesCommission, 0, 100) / 100)
        : Math.max(0, safeNum(inp.salesCommission, 0)) * netStudents;
      var adSpendBase = totalAdSpend;
      var addlMktgBase = Math.max(0, safeNum(inp.additionalMarketingPerStudent, 0)) * netStudents;
      var otherVarBase = Math.max(0, safeNum(inp.otherVariablePerStudent, 0)) * netStudents;

      var salesTax = applyExpenseTax(salesBase, gstRatePct, elig.sales, inp.gstCreditTreatment);
      var adSpendTax = applyExpenseTax(adSpendBase, gstRatePct, elig.marketing, inp.gstCreditTreatment);
      var addlMktgTax = applyExpenseTax(addlMktgBase, gstRatePct, elig.marketing, inp.gstCreditTreatment);
      var otherVarTax = applyExpenseTax(otherVarBase, gstRatePct, elig.otherVariable, inp.gstCreditTreatment);

      var salesCommissionExpense = salesTax.effectiveExpense;
      var marketingExpenses = adSpendTax.effectiveExpense + addlMktgTax.effectiveExpense;
      var otherVariableExpenses = otherVarTax.effectiveExpense;
      var variableSalesAndAcqCosts = salesCommissionExpense + marketingExpenses + otherVariableExpenses;

      var totalVariableExpenses = directDeliveryCosts + variableSalesAndAcqCosts;
      var totalContribution = grossProfit - variableSalesAndAcqCosts;
      var contributionPerStudent = safeDiv(totalContribution, netStudents);
      var contributionMarginPct = safeDiv(totalContribution, netRevenue) !== null ? safeDiv(totalContribution, netRevenue) * 100 : null;

      var fixedBase = Math.max(0, safeNum(inp.batchOverhead, 0)) + Math.max(0, safeNum(inp.otherFixedExpenses, 0));
      var fixedTax = applyExpenseTax(fixedBase, gstRatePct, elig.fixed, inp.gstCreditTreatment);
      var totalFixedExpenses = fixedTax.effectiveExpense;

      var totalExpenses = totalVariableExpenses + totalFixedExpenses;
      var operatingProfit = totalContribution - totalFixedExpenses;
      var profitPerStudent = safeDiv(operatingProfit, netStudents);
      var profitMarginPct = safeDiv(operatingProfit, netRevenue) !== null ? safeDiv(operatingProfit, netRevenue) * 100 : null;

      var cpl = safeDiv(totalAdSpend, totalLeads);
      var marketingCac = safeDiv(totalAdSpend, attributedStudents);
      var leadToStudentPct = safeDiv(attributedStudents, totalLeads) !== null ? safeDiv(attributedStudents, totalLeads) * 100 : null;
      var breakEven = computeBreakEven(totalFixedExpenses, contributionPerStudent);

      var totalRecoverableItc = lmsTax.recoverableItc + trainerTax.recoverableItc + gatewayTax.recoverableItc +
        salesTax.recoverableItc + adSpendTax.recoverableItc + addlMktgTax.recoverableItc + otherVarTax.recoverableItc + fixedTax.recoverableItc;
      var totalNonRecoverableGst = lmsTax.nonRecoverableGst + trainerTax.nonRecoverableGst + gatewayTax.nonRecoverableGst +
        salesTax.nonRecoverableGst + adSpendTax.nonRecoverableGst + addlMktgTax.nonRecoverableGst + otherVarTax.nonRecoverableGst + fixedTax.nonRecoverableGst;
      var netGstPayable = Math.max(0, gstCollected - totalRecoverableItc);
      var incomeTax = computeOptionalIncomeTax(operatingProfit, inp.includeIncomeTax, inp.incomeTaxRatePct);

      var warnings = [];
      if (enrolledStudents === 0) warnings.push({ level: 'info', text: 'Enrolled students is 0. Enter enrollment volume to compute per-student economics.' });
      if (attributedStudents > enrolledStudents && enrolledStudents > 0) warnings.push({ level: 'amber', text: 'Attributed paying students (' + attributedStudents + ') exceeds enrolled students (' + enrolledStudents + ').' });
      if (totalAdSpend > 0 && totalLeads === 0) warnings.push({ level: 'amber', text: 'Advertising spend is entered without lead counts — CPL is N/A.' });
      if (totalAdSpend > 0 && attributedStudents === 0) warnings.push({ level: 'amber', text: 'Advertising spend is entered without attributed paying students — Marketing CAC is N/A.' });
      if (netStudents > 0 && operatingProfit < 0) warnings.push({ level: 'red', text: 'Business is operating at a loss of ' + formatINR(Math.abs(operatingProfit)) + '.' });

        incomeTax: incomeTax,
        expenseCategories: [
          { key: 'fulfillment', label: isCommissionOnly ? 'Payment Gateway Fees' : 'Supplier Fulfillment & Gateway', amount: directFulfillmentCosts },
          { key: 'marketing', label: 'Marketing & Advertising', amount: marketingExpenses },
          { key: 'sales', label: 'Sales Commissions', amount: 0 },
          { key: 'otherVariable', label: 'Other Variable Traveler Costs', amount: otherVariableExpenses },
          { key: 'fixed', label: 'Trip & Operational Fixed Overhead', amount: totalFixedExpenses }
        ],
        waterfall: [
          { label: isCommissionOnly ? 'Gross Comm.' : 'Gross Package', value: waterfallGrossCollections, type: 'total' },
          { label: 'Cancellations', value: -waterfallCancellations, type: 'negative' },
          { label: 'GST Collected', value: -gstCollected, type: 'negative' },
          { label: 'Net Revenue', value: netRevenue, type: 'subtotal' },
          { label: isCommissionOnly ? 'Gateway Fees' : 'Supplier & GW', value: -directFulfillmentCosts, type: 'negative' },
          { label: 'Gross Profit', value: grossProfit, type: 'subtotal' },
          { label: 'Mktg & Var.', value: -variableSalesAndAcqCosts, type: 'negative' },
          { label: 'Contribution', value: totalContribution, type: 'subtotal' },
          { label: 'Fixed Overhead', value: -totalFixedExpenses, type: 'negative' },
          { label: 'Operating Profit', value: operatingProfit, type: 'final' }
        ],
        warnings: warnings
      };
    }

    function calculateOverview(eduRes, reRes, trRes) {
      var totalNetRevenue = eduRes.netRevenue + reRes.netRevenue + trRes.netRevenue;
      var totalOperatingProfit = eduRes.operatingProfit + reRes.operatingProfit + trRes.operatingProfit;
      var totalExpenses = eduRes.totalExpenses + reRes.totalExpenses + trRes.totalExpenses;
      var overallProfitMarginPct = safeDiv(totalOperatingProfit, totalNetRevenue) !== null
        ? safeDiv(totalOperatingProfit, totalNetRevenue) * 100 : null;
      var expMap = { fulfillment: 0, marketing: 0, sales: 0, otherVariable: 0, fixed: 0 };
      [eduRes, reRes, trRes].forEach(function (r) {
        r.expenseCategories.forEach(function (c) {
          if (expMap[c.key] !== undefined) expMap[c.key] += c.amount;
        });
      });
      return {
        totalNetRevenue: totalNetRevenue, totalOperatingProfit: totalOperatingProfit,
        totalExpenses: totalExpenses, overallProfitMarginPct: overallProfitMarginPct,
        expenseBreakdown: [
          { key: 'fulfillment', label: 'Fulfillment & Delivery', amount: expMap.fulfillment },
          { key: 'marketing', label: 'Marketing & Advertising', amount: expMap.marketing },
          { key: 'sales', label: 'Sales Commissions', amount: expMap.sales },
          { key: 'otherVariable', label: 'Other Variable Expenses', amount: expMap.otherVariable },
          { key: 'fixed', label: 'Fixed Overhead', amount: expMap.fixed }
        ]
      };
    }

    function runWhatIf(industry, baseInputs, scenarioType) {
      var mod = JSON.parse(JSON.stringify(baseInputs));
      var label = '';
      if (industry === 'education') {
        if (scenarioType === 'cac_up_20') { mod.totalAdSpend = Math.round(mod.totalAdSpend * 1.2); label = 'Marketing CAC increases by 20%'; }
        else if (scenarioType === 'ad_down_20') { mod.totalAdSpend = Math.round(mod.totalAdSpend * 0.8); label = 'Advertising spend decreases by 20%'; }
        else if (scenarioType === 'conv_up_10') { mod.enrolledStudents = Math.round(mod.enrolledStudents * 1.1); mod.attributedStudents = Math.round(mod.attributedStudents * 1.1); label = 'Conversion rate improves by 10%'; }
        else if (scenarioType === 'price_up_5') { mod.courseFee = Math.round(mod.courseFee * 1.05); label = 'Course fee increases by 5%'; }
        else if (scenarioType === 'supplier_up_10') { mod.lmsCost = Math.round(mod.lmsCost * 1.1); mod.trainerCost = Math.round(mod.trainerCost * 1.1); label = 'Delivery costs (LMS & Trainer) increase by 10%'; }
        else if (scenarioType === 'cancel_up_5') { mod.refundPct = Math.min(100, safeNum(mod.refundPct, 0) + 5); label = 'Refund rate increases by 5 percentage points'; }
        return { label: label, base: calculateEducation(baseInputs), simulated: calculateEducation(mod), modifiedInputs: mod };
      } else if (industry === 'realEstate') {
        if (scenarioType === 'cac_up_20') { mod.totalAdSpend = Math.round(mod.totalAdSpend * 1.2); label = 'Marketing CAC increases by 20%'; }
        else if (scenarioType === 'ad_down_20') { mod.totalAdSpend = Math.round(mod.totalAdSpend * 0.8); label = 'Advertising spend decreases by 20%'; }
        else if (scenarioType === 'conv_up_10') { mod.grossClosedDeals = Number((mod.grossClosedDeals * 1.1).toFixed(2)); label = 'Lead-to-close conversion improves by 10%'; }
        else if (scenarioType === 'price_up_5') {
          if (mod.revenueMethod === 'FIXED_PER_DEAL') mod.fixedRevenuePerDeal = Math.round(mod.fixedRevenuePerDeal * 1.05);
          else mod.brokerageRatePct = Number((mod.brokerageRatePct * 1.05).toFixed(3));
          label = 'Brokerage / deal fee increases by 5%';
        }
        else if (scenarioType === 'supplier_up_10') { mod.salesCostPerNetDeal = Math.round(mod.salesCostPerNetDeal * 1.1); mod.otherVariableCostPerNetDeal = Math.round(mod.otherVariableCostPerNetDeal * 1.1); label = 'Sales & closing costs increase by 10%'; }
        else if (scenarioType === 'cancel_up_5') { mod.cancellationRatePct = Math.min(100, safeNum(mod.cancellationRatePct, 0) + 5); label = 'Cancellation rate increases by 5 percentage points'; }
        return { label: label, base: calculateRealEstate(baseInputs), simulated: calculateRealEstate(mod), modifiedInputs: mod };
      } else {
        if (scenarioType === 'cac_up_20') { mod.totalAdSpend = Math.round(mod.totalAdSpend * 1.2); label = 'Marketing CAC increases by 20%'; }
        else if (scenarioType === 'ad_down_20') { mod.totalAdSpend = Math.round(mod.totalAdSpend * 0.8); label = 'Advertising spend decreases by 20%'; }
        else if (scenarioType === 'conv_up_10') { mod.travelers = Math.round(mod.travelers * 1.1); mod.bookings = Math.round(mod.bookings * 1.1); mod.attributedBookings = Math.round(mod.attributedBookings * 1.1); label = 'Conversion rate improves by 10%'; }
        else if (scenarioType === 'price_up_5') { mod.sellingPricePerTraveler = Math.round(mod.sellingPricePerTraveler * 1.05); label = 'Package price increases by 5%'; }
        else if (scenarioType === 'supplier_up_10') { mod.hotelSupplierCostPerTraveler = Math.round(mod.hotelSupplierCostPerTraveler * 1.1); mod.transportCostPerTraveler = Math.round(mod.transportCostPerTraveler * 1.1); mod.mealCostPerTraveler = Math.round(mod.mealCostPerTraveler * 1.1); label = 'Supplier costs increase by 10%'; }
        else if (scenarioType === 'cancel_up_5') { mod.cancellationRatePct = Math.min(100, safeNum(mod.cancellationRatePct, 0) + 5); label = 'Cancellation rate increases by 5 percentage points'; }
        return { label: label, base: calculateTravel(baseInputs), simulated: calculateTravel(mod), modifiedInputs: mod };
      }
    }

    function generateRuleBasedAdvice(result) {
      var unit = result.unitLabel;
      var unitsPlural = result.unitLabelPlural;
      var isProfitable = result.operatingProfit > 0;
      var sortedCosts = result.expenseCategories
        .filter(function (c) { return c.amount > 0; })
        .sort(function (a, b) { return b.amount - a.amount; })
        .slice(0, 3)
        .map(function (c) {
          var share = result.totalExpenses > 0 ? (c.amount / result.totalExpenses) * 100 : 0;
          var tip = 'Audit vendor contracts and introduce volume tiers to reduce this cost category.';
          if (c.key === 'marketing') {
            tip = 'Pause underperforming ad sets and improve lead qualification to reduce Marketing CAC from ' + formatINR(result.marketingCac) + '.';
          } else if (c.key === 'fulfillment') {
            tip = result.industry === 'travel'
              ? 'Negotiate contracted net rates with hotels/transport suppliers or shift high-volume routes to fixed-allotment pricing.'
              : result.industry === 'education'
                ? 'Transition trainer or LMS fees from per-student to fixed per-batch pricing as enrollment scales beyond ' + formatCount(result.netUnits) + ' students.'
                : 'Standardize legal/closing documentation workflows to trim per-deal fulfillment overhead.';
          } else if (c.key === 'sales') {
            tip = 'Align sales commissions to net collected revenue and tiered contribution thresholds rather than flat payouts.';
          } else if (c.key === 'fixed') {
            tip = 'Grow volume past the ' + (result.breakEven.achievable ? result.breakEven.units : 'N/A') + ' ' + unitsPlural + ' break-even point to amortize ' + formatINR(result.totalFixedExpenses) + ' fixed overhead.';
          }
          return {
            label: c.label, amount: c.amount, pctOfTotal: share,
            whyItMatters: c.label + ' accounts for ' + formatPct(share) + ' of total expenses (' + formatINR(c.amount) + ').',
            optimization: tip
          };
        });

      var cmHealth = result.contributionMarginPct === null ? 'undefined (net revenue is ₹0)'
        : result.contributionMarginPct >= 40 ? 'healthy (' + formatPct(result.contributionMarginPct) + ')'
        : result.contributionMarginPct >= 20 ? 'moderate (' + formatPct(result.contributionMarginPct) + ')'
        : 'thin (' + formatPct(result.contributionMarginPct) + ')';

      var breakEvenText = result.breakEven.achievable
        ? (result.netUnits >= result.breakEven.units
          ? 'You are ' + formatCount(result.netUnits - result.breakEven.units, 1) + ' ' + unitsPlural + ' above break-even (' + result.breakEven.units + ' ' + unitsPlural + ').'
          : 'You need ' + formatCount(result.breakEven.units - result.netUnits, 1) + ' more ' + unitsPlural + ' to reach break-even (' + result.breakEven.units + ' ' + unitsPlural + ').')
        : 'Break-even is not achievable because contribution per ' + unit + ' is ' + formatINR(result.contributionPerUnit) + '.';

      var summary = isProfitable
        ? 'Your ' + result.label + ' model is profitable, generating ' + formatINR(result.operatingProfit) + ' in operating profit (' + formatPct(result.profitMarginPct) + ' margin) on ' + formatINR(result.netRevenue) + ' net revenue.'
        : result.operatingProfit === 0
          ? 'Your ' + result.label + ' model is at exact break-even (₹0 operating profit) on ' + formatINR(result.netRevenue) + ' net revenue.'
          : 'Your ' + result.label + ' model is operating at a loss of ' + formatINR(Math.abs(result.operatingProfit)) + ' (' + formatPct(result.profitMarginPct) + ' margin) on ' + formatINR(result.netRevenue) + ' net revenue.';

      var profitabilityAssessment = 'Contribution margin is ' + cmHealth + ', producing ' + formatINR(result.contributionPerUnit) + ' contribution and ' + formatINR(result.profitPerUnit) + ' operating profit per ' + unit + '. ' + breakEvenText;

      var risks = result.warnings.slice(0, 3).map(function (w) { return w.text; });
      if (risks.length === 0) {
        risks.push('Watch Marketing CAC (' + formatINR(result.marketingCac) + ') relative to contribution per ' + unit + ' (' + formatINR(result.contributionPerUnit) + ') when scaling spend.');
        risks.push('A 5 percentage point rise in refunds/cancellations directly erodes net revenue while fixed overhead remains unchanged.');
      }

      var recs = [];
      if (sortedCosts[0]) recs.push('Address your #1 cost driver — ' + sortedCosts[0].label + ' (' + formatINR(sortedCosts[0].amount) + ', ' + formatPct(sortedCosts[0].pctOfTotal) + ' of expenses): ' + sortedCosts[0].optimization);
      var priceSim = runWhatIf(result.industry, result.inputs, 'price_up_5');
      recs.push('Test a 5% price increase: at current volume, +5% pricing lifts operating profit by ' + formatINR(priceSim.simulated.operatingProfit - result.operatingProfit) + ' (to ' + formatINR(priceSim.simulated.operatingProfit) + ').');
      var convSim = runWhatIf(result.industry, result.inputs, 'conv_up_10');
      recs.push('Improve funnel conversion by 10%: holding ad spend constant at ' + formatINR(result.inputs.totalAdSpend) + ', +10% conversion adds ' + formatINR(convSim.simulated.operatingProfit - result.operatingProfit) + ' in operating profit.');

      return {
        source: 'Rule-Based Deterministic Advisor',
        summary: summary,
        profitabilityAssessment: profitabilityAssessment,
        topCostDrivers: sortedCosts,
        mainRisks: risks,
        recommendations: recs
      };
    }

    return {
      safeNum, clamp, safeDiv, formatINR, formatPct, formatCount,
      DEFAULT_EDUCATION_INPUTS, DEFAULT_REAL_ESTATE_INPUTS, DEFAULT_TRAVEL_INPUTS,
      calculateEducation, calculateRealEstate, calculateTravel, calculateOverview,
      runWhatIf, generateRuleBasedAdvice
    };
  })();
  </script>

  <!-- ========================================================================

  <script>
  (function () {
    'use strict';

    const E = UnitWiseEngine;
    const STORAGE_KEY = 'unitwise_ai_workspace_v1';

    // Default Scenario Presets for each industry
    function buildDefaultScenarios() {
      const eduBase = JSON.parse(JSON.stringify(E.DEFAULT_EDUCATION_INPUTS));
      const eduBest = Object.assign({}, eduBase, { enrolledStudents: 40, attributedStudents: 40, courseFee: 27000, totalAdSpend: 140000 });
      const eduWorst = Object.assign({}, eduBase, { enrolledStudents: 20, attributedStudents: 20, refundPct: 10, totalAdSpend: 170000 });

      const reBase = JSON.parse(JSON.stringify(E.DEFAULT_REAL_ESTATE_INPUTS));
      const reBest = Object.assign({}, reBase, { grossClosedDeals: 5, bookings: 7, siteVisits: 22, totalAdSpend: 65000 });
      const reWorst = Object.assign({}, reBase, { grossClosedDeals: 2, cancellationRatePct: 15, totalAdSpend: 75000 });

      const trBase = JSON.parse(JSON.stringify(E.DEFAULT_TRAVEL_INPUTS));
      const trBest = Object.assign({}, trBase, { travelers: 28, bookings: 14, attributedBookings: 14, sellingPricePerTraveler: 37000, hotelSupplierCostPerTraveler: 17000 });
      const trWorst = Object.assign({}, trBase, { travelers: 14, bookings: 7, attributedBookings: 7, cancellationRatePct: 10, totalAdSpend: 75000 });

      return {
        education: [
          { id: 'edu-base', name: 'Base Case', inputs: eduBase },
          { id: 'edu-best', name: 'Best Case', inputs: eduBest },
          { id: 'edu-worst', name: 'Worst Case', inputs: eduWorst }
        ],
        realEstate: [
          { id: 're-base', name: 'Base Case', inputs: reBase },
          { id: 're-best', name: 'Best Case', inputs: reBest },
          { id: 're-worst', name: 'Worst Case', inputs: reWorst }
        ],
        travel: [
          { id: 'tr-base', name: 'Base Case', inputs: trBase },
          { id: 'tr-best', name: 'Best Case', inputs: trBest },
          { id: 'tr-worst', name: 'Worst Case', inputs: trWorst }
        ]
      };
    }

    function getDefaultState() {
      return {
        activePage: 'overview',
        education: JSON.parse(JSON.stringify(E.DEFAULT_EDUCATION_INPUTS)),
        realEstate: JSON.parse(JSON.stringify(E.DEFAULT_REAL_ESTATE_INPUTS)),
        travel: JSON.parse(JSON.stringify(E.DEFAULT_TRAVEL_INPUTS)),
        scenarios: buildDefaultScenarios(),
        scenarioIndustry: 'education',
        advisorIndustry: 'education',
        activeWhatIf: 'cac_up_20',
        glossarySearch: '',
        glossaryTab: 'glossary',
        settings: {
          aiEndpointUrl: '',
          aiMode: 'RULE_BASED',
          supabaseUrl: '',
          reportingPeriod: 'Current Cycle / Monthly Illustrative'
        }
      };
    }

    function loadState() {
      const def = getDefaultState();
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return def;
        const parsed = JSON.parse(raw);
        return {
          activePage: parsed.activePage || 'overview',
          education: Object.assign({}, def.education, parsed.education || {}),
          realEstate: Object.assign({}, def.realEstate, parsed.realEstate || {}),
          travel: Object.assign({}, def.travel, parsed.travel || {}),
          scenarios: parsed.scenarios && parsed.scenarios.education ? parsed.scenarios : def.scenarios,
          scenarioIndustry: parsed.scenarioIndustry || 'education',
          advisorIndustry: parsed.advisorIndustry || 'education',
          activeWhatIf: parsed.activeWhatIf || 'cac_up_20',
          glossarySearch: '',
          glossaryTab: 'glossary',
          settings: Object.assign({}, def.settings, parsed.settings || {})
        };
      } catch (e) {
        return def;
      }
    }

    let state = loadState();
    let activeCharts = {};

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          activePage: state.activePage,
          education: state.education,
          realEstate: state.realEstate,
          travel: state.travel,
          scenarios: state.scenarios,
          scenarioIndustry: state.scenarioIndustry,
          advisorIndustry: state.advisorIndustry,
          activeWhatIf: state.activeWhatIf,
          settings: state.settings
        }));
        const el = document.getElementById('save-status-text');
        if (el) {
          el.textContent = 'Saved locally';
        }
      } catch (e) {
        const el = document.getElementById('save-status-text');
        if (el) el.textContent = 'Session only';
      }
    }

    function destroyCharts() {
      Object.keys(activeCharts).forEach(k => {
        if (activeCharts[k]) {
          try { activeCharts[k].destroy(); } catch (e) {}
        }
      });
      activeCharts = {};
    }

    function showToast(message, type) {
      const container = document.getElementById('toast-container');
      const colors = type === 'error'
        ? 'bg-red-600 text-white'
        : type === 'warning'
          ? 'bg-amber-600 text-white'
          : 'bg-slate-900 text-white';
      const el = document.createElement('div');
      el.className = 'pointer-events-auto px-4 py-2.5 rounded-lg shadow-lg text-sm font-medium flex items-center gap-2 transition-opacity duration-200 ' + colors;
      el.textContent = message;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        setTimeout(() => el.remove(), 220);
      }, 2800);
    }

    // In-page confirmation modal
    let modalConfirmCallback = null;
    function openConfirmModal(title, message, onConfirm) {
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-message').textContent = message;
      modalConfirmCallback = onConfirm;
      const modal = document.getElementById('confirm-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }
    function closeConfirmModal() {
      const modal = document.getElementById('confirm-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      modalConfirmCallback = null;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function infoTip(text) {
      return '<span class="tooltip-wrap ml-1 text-slate-400 hover:text-slate-600 cursor-help" tabindex="0">' +
        '<i data-lucide="info" class="w-3.5 h-3.5"></i>' +
        '<span class="tooltip-box">' + escapeHtml(text) + '</span></span>';
    }

    function kpiCard(label, value, subtext, tone, tip) {
      const toneClass = tone === 'positive'
        ? 'text-emerald-600'
        : tone === 'negative'
          ? 'text-red-600'
          : tone === 'amber'
            ? 'text-amber-600'
            : 'text-slate-900';
      const badgeBg = tone === 'positive'
        ? 'bg-emerald-50 border-emerald-200/80'
        : tone === 'negative'
          ? 'bg-red-50 border-red-200/80'
          : 'bg-white border-slate-200';
      return `
        <div class="rounded-xl border p-4 shadow-sm ${badgeBg}">
          <div class="flex items-center justify-between text-xs font-medium text-slate-500">
            <span class="flex items-center">${escapeHtml(label)}${tip ? infoTip(tip) : ''}</span>
          </div>
          <div class="mt-2 text-xl sm:text-2xl font-bold tracking-tight ${toneClass}">${escapeHtml(value)}</div>
          ${subtext ? `<div class="mt-1 text-xs text-slate-500">${escapeHtml(subtext)}</div>` : ''}
        </div>
      `;
    }

    function calcAll() {
      const edu = E.calculateEducation(state.education);
      const re = E.calculateRealEstate(state.realEstate);
      const tr = E.calculateTravel(state.travel);
      const ov = E.calculateOverview(edu, re, tr);
      return { edu, re, tr, ov };
    }

    // ========================================================================
    // EXPORT ENGINE (CSV, PDF via jsPDF, Print)
    // ========================================================================
    function escapeCsv(val) {
      const s = String(val === null || val === undefined ? '' : val);
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }

    function exportCSV(industry) {

        ? E.calculateEducation(state.education)
        : industry === 'realEstate'
          ? E.calculateRealEstate(state.realEstate)

        ['UnitWise AI — Financial Unit Economics Export'],

        [],
        ['SECTION', 'METRIC', 'VALUE', 'NOTES']

      Object.keys(res.inputs).forEach(k => {

      rows.push(['Revenue & Tax', 'Non-Recoverable Input GST', res.taxSummary.nonRecoverableGst.toFixed(2), 'Included in expenses if applicable']);
      rows.push(['Revenue & Tax', 'Net Revenue per ' + res.unitLabel, res.netRevenuePerUnit !== null ? res.netRevenuePerUnit.toFixed(2) : 'N/A', 'INR']);
      rows.push([]);
      rows.push(['Expenses', 'Direct Fulfillment / Delivery Costs', res.directFulfillmentCosts.toFixed(2), 'INR']);
      rows.push(['Expenses', 'Variable Sales & Acquisition Costs', res.variableSalesAndAcqCosts.toFixed(2), 'INR']);
      rows.push(['Expenses', 'Total Variable Costs', res.totalVariableExpenses.toFixed(2), 'INR']);
      rows.push(['Expenses', 'Total Fixed Overhead', res.totalFixedExpenses.toFixed(2), 'INR']);
      rows.push(['Expenses', 'Total Business Expenses', res.totalExpenses.toFixed(2), 'INR']);
      rows.push([]);
      rows.push(['Profitability', 'Gross Profit', res.grossProfit.toFixed(2), 'INR']);
      rows.push(['Profitability', 'Total Contribution', res.totalContribution.toFixed(2), 'INR']);
      rows.push(['Profitability', 'Contribution per ' + res.unitLabel, res.contributionPerUnit !== null ? res.contributionPerUnit.toFixed(2) : 'N/A', 'INR']);
      rows.push(['Profitability', 'Contribution Margin (%)', res.contributionMarginPct !== null ? res.contributionMarginPct.toFixed(2) + '%' : 'N/A', '']);
      rows.push(['Profitability', 'Operating Profit', res.operatingProfit.toFixed(2), 'INR']);
      rows.push(['Profitability', 'Profit per ' + res.unitLabel, res.profitPerUnit !== null ? res.profitPerUnit.toFixed(2) : 'N/A', 'INR']);
      rows.push(['Profitability', 'Operating Profit Margin (%)', res.profitMarginPct !== null ? res.profitMarginPct.toFixed(2) + '%' : 'N/A', '']);
      if (res.incomeTax.enabled) {
        rows.push(['Income Tax (Optional)', 'Estimated Income Tax (' + res.incomeTax.ratePct + '%)', res.incomeTax.estimatedIncomeTax.toFixed(2), 'Separate from operating expenses']);
        rows.push(['Income Tax (Optional)', 'Estimated Post-Tax Profit', res.incomeTax.postTaxProfit.toFixed(2), 'INR']);

      rows.push([]);
      rows.push(['Unit Economics', 'Net ' + res.unitLabelPlural, res.netUnits, '']);
      rows.push(['Unit Economics', 'Cost Per Lead / Enquiry (CPL)', res.cpl !== null ? res.cpl.toFixed(2) : 'N/A', 'INR']);
      rows.push(['Unit Economics', 'Marketing CAC per ' + res.unitLabel, res.marketingCac !== null ? res.marketingCac.toFixed(2) : 'N/A', 'INR']);
      rows.push(['Unit Economics', 'Break-even ' + res.unitLabelPlural, res.breakEven.achievable ? res.breakEven.units : res.breakEven.message, '']);

      const csv = '\uFEFF' + rows.map(r => r.map(escapeCsv).join(',')).join('\r\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'UnitWise-AI-' + industry + '-report.csv';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('CSV report exported for ' + res.label);
    }

    function exportPDF(industry) {
      if (!window.jspdf || !window.jspdf.jsPDF) {
        showToast('PDF library loading — use Print Report as fallback.', 'warning');
        return;
      }
      const res = industry === 'education'
        ? E.calculateEducation(state.education)
        : industry === 'realEstate'
          ? E.calculateRealEstate(state.realEstate)
          : E.calculateTravel(state.travel);
      const advice = E.generateRuleBasedAdvice(res);
      const doc = new window.jspdf.jsPDF({ unit: 'pt', format: 'a4' });
      const pageW = doc.internal.pageSize.getWidth();
      let y = 40;

      // Header Banner
      doc.setFillColor(15, 23, 42);
      doc.rect(0, 0, pageW, 74, 'F');
      doc.setTextColor(255, 255, 255);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(18);
      doc.text('UnitWise AI — Financial Profitability Report', 40, 34);
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(10);
      doc.text(res.label + ' Unit Economics  |  ' + state.settings.reportingPeriod + '  |  Generated: ' + new Date().toLocaleDateString('en-IN'), 40, 54);

      y = 96;
      doc.setTextColor(15, 23, 42);
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(12);
      doc.text('Executive Summary & Key Metrics', 40, y);
      y += 16;

      const summaryRows = [
        ['Net Revenue (Excl. GST)', E.formatINR(res.netRevenue).replace(/₹/g, 'INR ')],
        ['Gross Profit', E.formatINR(res.grossProfit).replace(/₹/g, 'INR ')],
        ['Total Contribution', E.formatINR(res.totalContribution).replace(/₹/g, 'INR ') + ' (' + E.formatPct(res.contributionMarginPct) + ')'],
        ['Total Fixed Overhead', E.formatINR(res.totalFixedExpenses).replace(/₹/g, 'INR ')],
        ['Operating Profit', E.formatINR(res.operatingProfit).replace(/₹/g, 'INR ') + ' (' + E.formatPct(res.profitMarginPct) + ' margin)'],
        ['Contribution per ' + res.unitLabel, E.formatINR(res.contributionPerUnit).replace(/₹/g, 'INR ')],
        ['Marketing CAC / CPL', E.formatINR(res.marketingCac).replace(/₹/g, 'INR ') + ' / ' + E.formatINR(res.cpl).replace(/₹/g, 'INR ')],
        ['Break-even Volume', res.breakEven.achievable ? (res.breakEven.units + ' ' + res.unitLabelPlural) : res.breakEven.message]
      ];

      doc.setFontSize(9.5);
      summaryRows.forEach((row, idx) => {
        if (idx % 2 === 0) {
          doc.setFillColor(248, 250, 252);
          doc.rect(40, y - 11, pageW - 80, 18, 'F');
        }
        doc.setFont('helvetica', 'bold');
        doc.text(row[0], 48, y);
        doc.setFont('helvetica', 'normal');
        doc.text(row[1], 260, y);
        y += 18;
      });

      y += 12;
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(12);
      doc.text('GST & Tax Summary', 40, y);
      y += 16;
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(9.5);
      doc.text('GST Rate: ' + res.taxSummary.gstRatePct + '% (' + res.taxSummary.priceMode.replace('_', ' ') + ')  |  Input Credit: ' + res.taxSummary.gstCreditTreatment.replace('_', ' '), 40, y);
      y += 15;
      doc.text('GST Collected: ' + E.formatINR(res.gstCollected).replace(/₹/g, 'INR ') + '  |  Recoverable ITC: ' + E.formatINR(res.taxSummary.recoverableItc).replace(/₹/g, 'INR ') + '  |  Net GST Payable: ' + E.formatINR(res.taxSummary.netGstPayable).replace(/₹/g, 'INR '), 40, y);

      y += 22;
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(12);
      doc.text('Expense Breakdown', 40, y);
      y += 16;
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(9.5);
      res.expenseCategories.forEach(cat => {
        const share = res.totalExpenses > 0 ? ((cat.amount / res.totalExpenses) * 100).toFixed(1) + '%' : '0.0%';
        doc.text('- ' + cat.label + ': ' + E.formatINR(cat.amount).replace(/₹/g, 'INR ') + ' (' + share + ')', 48, y);
        y += 15;
      });

      // Embed waterfall chart image if available on canvas
      const wfCanvas = document.getElementById('chart-waterfall');
      if (wfCanvas && y < 560) {
        try {
          y += 10;
          doc.setFont('helvetica', 'bold');
          doc.setFontSize(12);
          doc.text('Revenue-to-Profit Waterfall', 40, y);
          y += 8;
          const imgData = wfCanvas.toDataURL('image/png', 1.0);
          doc.addImage(imgData, 'PNG', 40, y, pageW - 80, 155);
          y += 170;
        } catch (e) {}
      }

      if (y > 680) { doc.addPage(); y = 48; }
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(12);
      doc.text('Advisor Insights (Deterministic Rule-Based Engine)', 40, y);
      y += 16;
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(9.5);
      const lines = doc.splitTextToSize(advice.summary.replace(/₹/g, 'INR ') + ' ' + advice.profitabilityAssessment.replace(/₹/g, 'INR '), pageW - 80);
      doc.text(lines, 40, y);
      y += lines.length * 13 + 8;
      advice.recommendations.forEach((rec, i) => {
        const rLines = doc.splitTextToSize((i + 1) + '. ' + rec.replace(/₹/g, 'INR '), pageW - 80);
        if (y + rLines.length * 13 > 790) { doc.addPage(); y = 48; }
        doc.text(rLines, 40, y);
        y += rLines.length * 13 + 5;
      });

      doc.save('UnitWise-AI-' + industry + '-report.pdf');
      showToast('PDF report downloaded for ' + res.label);
    }

    function renderIndustryCharts(res) {
      const wfCtx = document.getElementById('chart-waterfall');
      if (wfCtx && window.Chart) {
        let running = 0;
        const bars = [];
        const colors = [];
        res.waterfall.forEach(step => {
          if (step.type === 'total' || step.type === 'subtotal' || step.type === 'final') {
            bars.push([0, step.value]);
            running = step.value;
            if (step.type === 'final') colors.push(step.value >= 0 ? '#10B981' : '#EF4444');
            else colors.push('#2563EB');
          } else {
            const start = running;
            const end = running + step.value;
            bars.push([Math.min(start, end), Math.max(start, end)]);
            running = end;
            colors.push(step.value < 0 ? '#F87171' : '#34D399');
          }
        });

        activeCharts.waterfall = new Chart(wfCtx, {
          type: 'bar',
          data: {
            labels: res.waterfall.map(s => s.label),
            datasets: [{
              label: 'Amount (INR)',
              data: bars,
              backgroundColor: colors,
              borderRadius: 4,
              borderSkipped: false
            }]
          },
          options: {
            responsive: true, maintainAspectRatio: false,
            plugins: {
              legend: { display: false },
              tooltip: {
                callbacks: {
                  label: ctx => {
                    const step = res.waterfall[ctx.dataIndex];
                    return step.label + ': ' + E.formatINR(step.value);
                  }
                }
              }
            },
            scales: {
              y: { grid: { color: '#F1F5F9' }, ticks: { callback: v => E.formatINR(v), font: { size: 11 } } },
              x: { grid: { display: false }, ticks: { font: { size: 10 }, maxRotation: 35, minRotation: 0 } }
            }
          }
        });
      }

      const expCtx = document.getElementById('chart-industry-exp');
      if (expCtx && window.Chart) {
        const items = res.expenseCategories.filter(x => x.amount > 0);
        activeCharts.industryExp = new Chart(expCtx, {
          type: 'doughnut',
          data: {
            labels: items.length ? items.map(x => x.label) : ['No Expenses'],
            datasets: [{
              data: items.length ? items.map(x => x.amount) : [1],
              backgroundColor: items.length ? ['#2563EB', '#F59E0B', '#8B5CF6', '#06B6D4', '#64748B'] : ['#E2E8F0'],
              borderWidth: 2, borderColor: '#FFFFFF'
            }]
          },
          options: {
            responsive: true, maintainAspectRatio: false, cutout: '62%',
            plugins: {
              legend: { position: 'bottom', labels: { usePointStyle: true, boxWidth: 8, font: { family: 'Inter', size: 11 } } },
              tooltip: {
                callbacks: {
                  label: ctx => {
                    if (!items.length) return '₹0';
                    const pct = res.totalExpenses > 0 ? ((ctx.raw / res.totalExpenses) * 100).toFixed(1) + '%' : '0%';
                    return ctx.label + ': ' + E.formatINR(ctx.raw) + ' (' + pct + ')';
                  }
                }
              }
            }
          }
        });
      }
    }

    // ========================================================================
    // INPUT FIELD HELPERS
    // ========================================================================
    function numInput(model, field, label, value, opts) {
      const o = opts || {};
      const step = o.step !== undefined ? o.step : 'any';
      const min = o.min !== undefined ? o.min : 0;
      const max = o.max !== undefined ? `max="${o.max}"` : '';
      const prefix = o.prefix ? `<span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs font-medium">${o.prefix}</span>` : '';
      const suffix = o.suffix ? `<span class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs font-medium">${o.suffix}</span>` : '';
      const padL = o.prefix ? 'pl-7' : '';
      const padR = o.suffix ? 'pr-8' : '';
      return `
        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1 flex items-center">${escapeHtml(label)}${o.tip ? infoTip(o.tip) : ''}</label>
          <div class="relative">
            ${prefix}
            <input type="number" min="${min}" ${max} step="${step}" value="${value}" data-model="${model}" data-field="${field}" class="input-base ${padL} ${padR}" />
            ${suffix}
          </div>
        </div>
      `;
    }

    function selectInput(model, field, label, value, options, tip) {
      return `
        <div>
          <label class="block text-xs font-medium text-slate-700 mb-1 flex items-center">${escapeHtml(label)}${tip ? infoTip(tip) : ''}</label>
          <select data-model="${model}" data-field="${field}" class="input-base">
            ${options.map(opt => `<option value="${opt.value}" ${opt.value === value ? 'selected' : ''}>${escapeHtml(opt.label)}</option>`).join('')}
          </select>
        </div>
      `;
    }

    // ========================================================================
    // PAGE 5: SCENARIO ANALYSIS
    // ========================================================================
    function calcByIndustry(ind, inp) {
      if (ind === 'education') return E.calculateEducation(inp);
      if (ind === 'realEstate') return E.calculateRealEstate(inp);
      return E.calculateTravel(inp);
    }

    function renderScenarioPage() {
      const ind = state.scenarioIndustry;
      const list = state.scenarios[ind] || [];
      const results = list.map(s => ({ id: s.id, name: s.name, inputs: s.inputs, calc: calcByIndustry(ind, s.inputs) }));

      function scenarioField(scId, field, label, val, opts) {
        const o = opts || {};
        return `
          <div>
            <label class="block text-[11px] font-medium text-slate-600 mb-1">${escapeHtml(label)}</label>
            <input type="number" min="0" step="${o.step || 'any'}" value="${val}" data-scen-id="${scId}" data-scen-field="${field}" class="input-base !py-1.5 !text-xs" />
          </div>
        `;
      }

      const cardsHtml = results.map(s => {
        const i = s.inputs;
        let fields = '';
        if (ind === 'education') {
          fields =
            scenarioField(s.id, 'courseFee', 'Course Fee (₹)', i.courseFee) +
            scenarioField(s.id, 'enrolledStudents', 'Students', i.enrolledStudents, { step: 1 }) +
            scenarioField(s.id, 'totalAdSpend', 'Ad Spend (₹)', i.totalAdSpend) +
            scenarioField(s.id, 'attributedStudents', 'Attributed Students', i.attributedStudents, { step: 1 }) +
            scenarioField(s.id, 'refundPct', 'Refund Rate (%)', i.refundPct) +
            scenarioField(s.id, 'trainerCost', 'Trainer Cost (₹)', i.trainerCost) +
            scenarioField(s.id, 'salesCommission', 'Sales Comm. (₹)', i.salesCommission) +
            scenarioField(s.id, 'batchOverhead', 'Fixed Overhead (₹)', i.batchOverhead);
        } else if (ind === 'realEstate') {
          fields =
            scenarioField(s.id, 'avgPropertyValue', 'Property Value (₹)', i.avgPropertyValue) +
            scenarioField(s.id, 'brokerageRatePct', 'Brokerage Rate (%)', i.brokerageRatePct) +
            scenarioField(s.id, 'grossClosedDeals', 'Gross Closed Deals', i.grossClosedDeals, { step: 1 }) +
            scenarioField(s.id, 'totalAdSpend', 'Ad Spend (₹)', i.totalAdSpend) +
            scenarioField(s.id, 'totalLeads', 'Total Leads', i.totalLeads, { step: 1 }) +
            scenarioField(s.id, 'cancellationRatePct', 'Cancellation (%)', i.cancellationRatePct) +
            scenarioField(s.id, 'salesCostPerNetDeal', 'Sales Cost/Deal (₹)', i.salesCostPerNetDeal) +
            scenarioField(s.id, 'monthlyFixedOverhead', 'Fixed Overhead (₹)', i.monthlyFixedOverhead);
        } else {
          fields =
            scenarioField(s.id, 'sellingPricePerTraveler', 'Package Price (₹)', i.sellingPricePerTraveler) +
            scenarioField(s.id, 'travelers', 'Travelers', i.travelers, { step: 1 }) +
            scenarioField(s.id, 'totalAdSpend', 'Ad Spend (₹)', i.totalAdSpend) +
            scenarioField(s.id, 'attributedBookings', 'Attributed Bookings', i.attributedBookings, { step: 1 }) +
            scenarioField(s.id, 'cancellationRatePct', 'Cancellation (%)', i.cancellationRatePct) +
            scenarioField(s.id, 'hotelSupplierCostPerTraveler', 'Hotel Cost/Pax (₹)', i.hotelSupplierCostPerTraveler) +
            scenarioField(s.id, 'otherVariableCostPerTraveler', 'Other Var./Pax (₹)', i.otherVariableCostPerTraveler) +
            scenarioField(s.id, 'fixedTripOverhead', 'Trip Overhead (₹)', i.fixedTripOverhead);
        }

        return `
          <div class="card p-4 space-y-3">
            <div class="flex items-center justify-between gap-2 border-b border-slate-100 pb-2.5">
              <input type="text" value="${escapeHtml(s.name)}" data-scen-rename="${s.id}" class="font-bold text-sm text-slate-900 bg-transparent border-b border-transparent hover:border-slate-300 focus:border-brand-600 focus:outline-none w-full" aria-label="Scenario name" />
              <div class="flex items-center gap-1 shrink-0">
                <button data-scen-dup="${s.id}" title="Duplicate scenario" class="p-1.5 rounded hover:bg-slate-100 text-slate-500 hover:text-slate-800"><i data-lucide="copy" class="w-3.5 h-3.5"></i></button>
                ${results.length > 1 ? `<button data-scen-del="${s.id}" title="Delete scenario" class="p-1.5 rounded hover:bg-red-50 text-slate-400 hover:text-red-600"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>` : ''}
              </div>
            </div>
            <div class="grid grid-cols-2 gap-2.5">${fields}</div>
            <div class="pt-2 border-t border-slate-100 flex items-center justify-between text-xs">
              <span class="text-slate-500">Operating Profit</span>
              <span class="font-bold ${s.calc.operatingProfit >= 0 ? 'text-emerald-600' : 'text-red-600'}">${E.formatINR(s.calc.operatingProfit)} (${E.formatPct(s.calc.profitMarginPct)})</span>
            </div>
          </div>
        `;
      }).join('');

      const metrics = [
        { label: 'Net Revenue', fn: c => E.formatINR(c.netRevenue) },
        { label: 'Total Expenses', fn: c => E.formatINR(c.totalExpenses) },
        { label: 'Total Contribution', fn: c => E.formatINR(c.totalContribution) },
        { label: 'Operating Profit', fn: c => E.formatINR(c.operatingProfit), highlight: true },
        { label: 'Profit Margin', fn: c => E.formatPct(c.profitMarginPct) },
        { label: 'Marketing CAC', fn: c => E.formatINR(c.marketingCac) },
        { label: 'Break-even Units', fn: c => c.breakEven.achievable ? (E.formatCount(c.breakEven.units) + ' ' + c.unitLabelPlural) : 'Not Achievable' }
      ];

      document.getElementById('page-content').innerHTML = `
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
          <div class="inline-flex rounded-lg border border-slate-200 bg-white p-1 shadow-sm">

          </div>
        </div>

        <!-- Editable Scenario Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">${cardsHtml}</div>

        <!-- Comparison Table -->
        <div class="card overflow-hidden">
          <div class="px-5 py-3.5 border-b border-slate-200 bg-slate-50/70">
            <h2 class="text-sm font-semibold text-slate-900">Scenario Comparison Matrix (Calculated Live via Deterministic Engine)</h2>
          </div>
          <div class="overflow-x-auto">

    const GLOSSARY_TERMS = [
      { term: 'Unit Economics', def: 'The direct revenues and costs associated with a single business unit (1 student, 1 closed deal, or 1 traveler).', ex: 'If a course earns ₹25,000 net fee and costs ₹15,750 in variable costs per student, unit contribution is ₹9,250.' },
      { term: 'Net Revenue', def: 'Recognized business revenue after deducting discounts, refunds/cancellations, and indirect taxes (GST).', ex: '₹8,85,000 collected (incl. 18% GST) equals ₹7,50,000 Net Revenue and ₹1,35,000 GST.' },
      { term: 'Gross Profit', def: 'Net Revenue minus Direct Service or Fulfillment Costs (e.g., LMS/Trainer/Gateway or Hotel/Transport).', ex: '₹7,00,000 package revenue minus ₹5,00,000 supplier costs = ₹2,00,000 Gross Profit.' },
      { term: 'Contribution Margin', def: 'Percentage of Net Revenue remaining after all variable delivery, sales, and marketing costs to cover fixed overhead.', ex: '₹2,77,500 Contribution ÷ ₹7,50,000 Net Revenue = 37.0% Contribution Margin.' },
      { term: 'Operating Profit', def: 'Total Contribution minus Fixed Period or Batch Overhead (before optional income tax).', ex: '₹2,77,500 Contribution minus ₹30,000 batch overhead = ₹2,47,500 Operating Profit.' },
      { term: 'Profit Margin', def: 'Operating Profit expressed as a percentage of Net Revenue.', ex: '₹1,80,000 Operating Profit ÷ ₹3,60,000 Net Brokerage Revenue = 50.0% Profit Margin.' },
      { term: 'Break-even Point', def: 'Minimum paying units required for Total Contribution to equal Fixed Overhead (CEILING(Fixed / Contribution per Unit)). Undefined if Contribution per Unit ≤ ₹0.', ex: '₹35,000 fixed overhead ÷ ₹5,000 contribution/traveler = 7 travelers to break even.' },
      { term: 'Customer Acquisition Cost (CAC)', def: 'Total Advertising Spend divided by Attributed Paying Customers.', ex: '₹60,000 ad spend ÷ 3 closed real estate deals = ₹20,000 Marketing CAC per deal.' },
      { term: 'Cost Per Lead (CPL)', def: 'Total Advertising Spend divided by Total Leads or Enquiries generated.', ex: '₹60,000 ad spend ÷ 300 leads = ₹200 CPL.' },
      { term: 'Conversion Rate', def: 'Percentage of leads or enquiries that advance to a downstream funnel stage or paying customer.', ex: '3 closed deals from 300 leads = 1.0% Lead-to-Close conversion rate.' },
      { term: 'Revenue Per Customer', def: 'Net Revenue divided by Net Paying Units (students, closed deals, or travelers).', ex: '₹3,60,000 brokerage revenue ÷ 3 net deals = ₹1,20,000 revenue per closed deal.' },
      { term: 'Variable Costs', def: 'Costs that scale directly with customer volume (e.g., LMS per student, hotel cost per traveler, sales commissions).', ex: '₹25,000 supplier cost per traveler × 20 travelers = ₹5,00,000.' },
      { term: 'Fixed Costs', def: 'Overhead expenses that stay constant regardless of short-term unit volume (e.g., office rent, monthly software, fixed batch support).', ex: '₹45,000 monthly office & CRM overhead.' },
      { term: 'GST (Goods & Services Tax)', def: 'Indirect tax collected on behalf of the government; excluded from recognized Net Revenue.', ex: '18% GST on ₹1,20,000 brokerage = ₹21,600 collected and remitted.' },
      { term: 'Recoverable Input GST (ITC)', def: 'GST paid on eligible business purchases that can offset Output GST liability — NOT treated as a business expense.', ex: '₹27,000 GST paid on ₹1,50,000 ad spend reduces net GST payable rather than inflating marketing expense.' },
      { term: 'Refund Rate', def: 'Percentage of enrolled customers who receive refunds, reducing both net units and recognized revenue.', ex: '10% refund on 30 enrolled students leaves 27 net paying students.' },
      { term: 'Cancellation Rate', def: 'Percentage of gross closed deals or travel bookings cancelled before fulfillment, excluded from recognized revenue.', ex: '20% cancellation on 10 gross deals leaves 8 net closed deals.' },
      { term: 'Revenue Recognition', def: 'Accounting rule defining what counts as business revenue (e.g., brokerage fee only in Real Estate; commission-only vs. gross package in Travel).', ex: 'On a ₹60,00,000 home at 2% brokerage, recognized revenue is ₹1,20,000 — never ₹60,00,000.' }
    ];

    const FORMULA_REFERENCE = [
      { name: 'Net Revenue', formula: 'Customer Collections (after discounts & refunds) − Indirect Taxes (GST)' },
      { name: 'GST Inclusive Extraction', formula: 'Net Revenue = Collections ÷ (1 + GST Rate)  |  GST = Collections − Net Revenue' },
      { name: 'Gross Profit', formula: 'Net Revenue − Direct Delivery / Fulfillment Costs' },
      { name: 'Total Contribution', formula: 'Gross Profit − Variable Sales & Acquisition Costs' },
      { name: 'Contribution Per Unit', formula: 'Total Contribution ÷ Net Paying Units' },
      { name: 'Contribution Margin (%)', formula: '(Total Contribution ÷ Net Revenue) × 100' },
      { name: 'Operating Profit', formula: 'Total Contribution − Fixed Period / Batch Overhead' },
      { name: 'Profit Per Unit', formula: 'Operating Profit ÷ Net Paying Units' },
      { name: 'Profit Margin (%)', formula: '(Operating Profit ÷ Net Revenue) × 100' },
      { name: 'Cost Per Lead (CPL)', formula: 'Total Advertising Spend ÷ Total Leads' },
      { name: 'Marketing CAC', formula: 'Total Advertising Spend ÷ Attributed Paying Customers' },
      { name: 'Break-even Units', formula: 'CEILING(Fixed Overhead ÷ Contribution Per Unit)  [Only when Contribution Per Unit > 0]' }
    ];

      destroyCharts();
      const meta = PAGE_META[state.activePage] || PAGE_META.overview;
      document.getElementById('topbar-title').textContent = meta.title;
      document.getElementById('topbar-subtitle').textContent = meta.sub;

      const resetBtn = document.getElementById('topbar-reset-btn');
      if (meta.showReset) {
        resetBtn.classList.remove('hidden');
        resetBtn.classList.add('inline-flex');
      } else {
        resetBtn.classList.add('hidden');
        resetBtn.classList.remove('inline-flex');
      }

      document.querySelectorAll('#sidebar-nav .nav-item').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.page === state.activePage);
      });

      if (state.activePage === 'overview') renderOverviewPage();
      else if (state.activePage === 'education') renderEducationPage();
      else if (state.activePage === 'realEstate') renderRealEstatePage();
      else if (state.activePage === 'travel') renderTravelPage();
      else if (state.activePage === 'scenarios') renderScenarioPage();
      else if (state.activePage === 'advisor') renderAdvisorPage();
      else if (state.activePage === 'glossary') renderGlossaryPage();
      else if (state.activePage === 'settings') renderSettingsPage();

      if (window.lucide) window.lucide.createIcons();
    }

    function navigate(page) {
      state.activePage = page;
      saveState();
      closeDrawer();
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Mobile drawer controls
    function openDrawer() {
      document.getElementById('sidebar').classList.remove('-translate-x-full');
      document.getElementById('mobile-overlay').classList.remove('hidden');
    }
    function closeDrawer() {
      document.getElementById('sidebar').classList.add('-translate-x-full');
      document.getElementById('mobile-overlay').classList.add('hidden');
    }

    document.getElementById('open-drawer-btn').addEventListener('click', openDrawer);
    document.getElementById('close-drawer-btn').addEventListener('click', closeDrawer);
    document.getElementById('mobile-overlay').addEventListener('click', closeDrawer);

    document.getElementById('modal-cancel-btn').addEventListener('click', closeConfirmModal);
    document.getElementById('modal-confirm-btn').addEventListener('click', () => {
      const cb = modalConfirmCallback;
      closeConfirmModal();
      if (cb) cb();
    });

    document.getElementById('sidebar-nav').addEventListener('click', e => {
      const btn = e.target.closest('[data-page]');
      if (btn) navigate(btn.dataset.page);
    });

    document.getElementById('topbar-reset-btn').addEventListener('click', () => {
      const p = state.activePage;
      if (p === 'education') state.education = JSON.parse(JSON.stringify(E.DEFAULT_EDUCATION_INPUTS));
      else if (p === 'realEstate') state.realEstate = JSON.parse(JSON.stringify(E.DEFAULT_REAL_ESTATE_INPUTS));
      else if (p === 'travel') state.travel = JSON.parse(JSON.stringify(E.DEFAULT_TRAVEL_INPUTS));
      else return;
      saveState();
      render();
      showToast('Reset to assignment sample defaults');
    });

    // Global delegated handlers inside #page-content
    const pageEl = document.getElementById('page-content');

    pageEl.addEventListener('click', e => {
      const navTarget = e.target.closest('[data-nav-target]');
      if (navTarget) { navigate(navTarget.dataset.navTarget); return; }

      const gotoAdv = e.target.closest('[data-goto-advisor]');
      if (gotoAdv) {
        state.advisorIndustry = gotoAdv.dataset.gotoAdvisor;
        navigate('advisor');
        return;
      }

      const travelModel = e.target.closest('[data-travel-model]');
      if (travelModel) {
        state.travel.revenueModel = travelModel.dataset.travelModel;
        state.travel.gstRatePct = state.travel.revenueModel === 'COMMISSION_ONLY' ? 18 : 5;
        saveState();
        render();
        showToast('Switched to ' + (state.travel.revenueModel === 'COMMISSION_ONLY' ? 'Commission-Only Revenue (18% GST default)' : 'Gross Package Revenue (5% GST default)'));
        return;
      }

      const clearBtn = e.target.closest('[data-clear-model]');
      if (clearBtn) {
        const model = clearBtn.dataset.clearModel;
        openConfirmModal('Clear All Inputs?', 'This will set all numeric inputs in this calculator to 0 so you can start from a blank slate.', () => {
          Object.keys(state[model]).forEach(k => {
            if (typeof state[model][k] === 'number' && k !== 'gstRatePct' && k !== 'incomeTaxRatePct' && k !== 'targetMarginPct') {
              state[model][k] = 0;
            }
          });
          saveState();
          render();
          showToast('All inputs cleared to 0');
        });
        return;
      }

      const pdfBtn = e.target.closest('[data-export-pdf]');
      if (pdfBtn) { exportPDF(pdfBtn.dataset.exportPdf); return; }

      const csvBtn = e.target.closest('[data-export-csv]');
      if (csvBtn) { exportCSV(csvBtn.dataset.exportCsv); return; }

      const printBtn = e.target.closest('[data-print-report]');
      if (printBtn) { window.print(); return; }

      const scenInd = e.target.closest('[data-scen-ind]');
      if (scenInd) { state.scenarioIndustry = scenInd.dataset.scenInd; saveState(); render(); return; }

      const scenDup = e.target.closest('[data-scen-dup]');
      if (scenDup) {
        const list = state.scenarios[state.scenarioIndustry];
        const orig = list.find(x => x.id === scenDup.dataset.scenDup);
        if (orig) {
          list.push({ id: 'sc-' + Date.now(), name: orig.name + ' (Copy)', inputs: JSON.parse(JSON.stringify(orig.inputs)) });
          saveState();
          render();
          showToast('Scenario duplicated');
        }
        return;
      }

      const scenDel = e.target.closest('[data-scen-del]');
      if (scenDel) {
        const id = scenDel.dataset.scenDel;
        openConfirmModal('Delete Scenario?', 'Remove this scenario from the comparison?', () => {
          state.scenarios[state.scenarioIndustry] = state.scenarios[state.scenarioIndustry].filter(x => x.id !== id);
          saveState();
          render();
          showToast('Scenario deleted');
        });
        return;
      }

      if (e.target.closest('#scen-sync-current')) {
        const ind = state.scenarioIndustry;
        if (state.scenarios[ind] && state.scenarios[ind][0]) {
          state.scenarios[ind][0].inputs = JSON.parse(JSON.stringify(state[ind]));
          saveState();
          render();
          showToast('Base Case synced from current calculator');
        }
        return;
      }

      if (e.target.closest('#scen-restore-defaults')) {
        state.scenarios[state.scenarioIndustry] = buildDefaultScenarios()[state.scenarioIndustry];
        saveState();
        render();
        showToast('Scenario defaults restored');
        return;
      }

      const advInd = e.target.closest('[data-adv-ind]');
      if (advInd) { state.advisorIndustry = advInd.dataset.advInd; saveState(); render(); return; }

      const whatIfBtn = e.target.closest('[data-whatif]');
      if (whatIfBtn) { state.activeWhatIf = whatIfBtn.dataset.whatif; saveState(); render(); return; }

      const glossTab = e.target.closest('[data-gloss-tab]');
      if (glossTab) { state.glossaryTab = glossTab.dataset.glossTab; render(); return; }

      if (e.target.closest('#export-json-btn')) {
        const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'unitwise-ai-workspace-backup.json';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('Workspace JSON downloaded');
        return;
      }

      if (e.target.closest('#reset-all-workspace-btn')) {
        openConfirmModal('Reset Entire Workspace?', 'This will restore all three calculators, scenarios, and settings to the original sample defaults.', () => {
          state = getDefaultState();
          saveState();
          render();
          showToast('Workspace reset to sample defaults');
        });
      }
    });

    // Live input updates (preserve cursor focus cleanly on change/input)
    let inputDebounce = null;
    pageEl.addEventListener('input', e => {
      const target = e.target;
      if (target.id === 'glossary-search-input') {
        state.glossarySearch = target.value;
        const pos = target.selectionStart;
        render();
        const el = document.getElementById('glossary-search-input');
        if (el) { el.focus(); el.setSelectionRange(pos, pos); }
        return;
      }
      if (target.id === 'setting-period') {
        state.settings.reportingPeriod = target.value;
        saveState();
        return;
      }
      if (target.dataset.scenRename) {
        const sc = (state.scenarios[state.scenarioIndustry] || []).find(x => x.id === target.dataset.scenRename);
        if (sc) {
          sc.name = target.value;
          saveState();
        }
        return;
      }
      if (target.dataset.model && target.dataset.field) {
        if (target.type === 'checkbox') return; // handled in change
        const model = target.dataset.model;
        const field = target.dataset.field;
        const val = target.tagName === 'SELECT' ? target.value : Math.max(0, Number(target.value) || 0);
        state[model][field] = val;
        saveState();
        clearTimeout(inputDebounce);
        inputDebounce = setTimeout(() => {
          const activeField = field;
          const activeModel = model;
          render();
          const refocus = pageEl.querySelector(`[data-model="${activeModel}"][data-field="${activeField}"]`);
          if (refocus && refocus.tagName === 'INPUT') {
            refocus.focus();
          }
        }, 280);
        return;
      }
      if (target.dataset.scenId && target.dataset.scenField) {
        const scId = target.dataset.scenId;
        const scField = target.dataset.scenField;
        const sc = (state.scenarios[state.scenarioIndustry] || []).find(x => x.id === scId);
        if (sc) {
          sc.inputs[scField] = Math.max(0, Number(target.value) || 0);
          saveState();
          clearTimeout(inputDebounce);
          inputDebounce = setTimeout(() => {
            render();
            const refocus = pageEl.querySelector(`[data-scen-id="${scId}"][data-scen-field="${scField}"]`);
            if (refocus) refocus.focus();
          }, 280);
        }
      }
    });

    pageEl.addEventListener('change', e => {
      const target = e.target;
      if (target.dataset.model && target.dataset.field) {
        const model = target.dataset.model;
        const field = target.dataset.field;
        if (target.type === 'checkbox') {
          state[model][field] = target.checked;
        } else if (target.tagName === 'SELECT') {
          state[model][field] = target.value;
        }
        saveState();
        render();
      } else if (target.dataset.scenRename) {
        render();
      }
    });

    // Initial render
    render();
  })();
  </script>
</body>
</html>
